version: "3.9"

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: blastradius-falkordb
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkordb-data:/data
    environment:
      - FALKORDB_ARGS=--save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "PING"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  graphiti-mcp:
    image: falkordb/graphiti-knowledge-graph-mcp:latest
    container_name: blastradius-graphiti
    ports:
      - "8000:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  queryweaver:
    image: falkordb/queryweaver:latest
    container_name: blastradius-queryweaver
    ports:
      - "5000:5000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - MEMORY_TTL_SECONDS=3600
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  falkordb-data:
